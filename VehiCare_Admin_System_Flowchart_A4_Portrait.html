<!DOCTYPE html>

  <style>
    @page {
      size: A4 portrait;
      margin: 8mm;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #e2e8f0;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0 40px 0;
    }
    .print-bar {
      width: 210mm;
      background: #ffffff;
      border: 1px solid #000000;
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .print-bar span {
      font-size: 13px;
      font-weight: bold;
    }
    .print-btn {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .a4-page {
      width: 210mm;
      height: 297mm;
      background: #ffffff;
      color: #000000;
      border: 1px solid #94a3b8;
      margin-bottom: 20px;
      padding: 8mm 10mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      page-break-after: always;
      overflow: hidden;
    }
    .sheet-title {
      font-size: 12px;
      font-weight: bold;
      border-bottom: 1.5px solid #000000;
      padding-bottom: 4px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .svg-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 100%;
      height: 100%;
    }
    .shape {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 1.5;
    }
    .line {
      fill: none;
      stroke: #000000;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .txt {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .txt-b {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10.5px;
      font-weight: bold;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .lbl {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9.5px;
      font-weight: bold;
      fill: #000000;
    }
    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .a4-page {
        border: none !important;
        margin: 0 !important;
        width: 194mm !important;
        height: 281mm !important;
      }
    }
  </style>
</head>
